name: mobile_app
description: "Pomegranate Growth Stage Detection App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  http: ^1.6.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/pomegranate.jpeg
    - assets/images/bud.png
    - assets/images/early_fruit.png
    - assets/images/mid_growth.png
    - assets/images/Mature.png
    - assets/images/Flower.jpg
    - assets/images/Early_Fruit.jpg
    - assets/images/Mature_fruit.jpg
    - assets/images/Mid_Growth.jpg
