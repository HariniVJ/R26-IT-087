name: PomCare
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  image_picker: ^1.1.2
  tflite_flutter: ^0.11.0
  image: ^4.1.7
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/farm_bg.jpeg
    - assets/images/farm_bg1.jpeg
    - assets/images/farm_bg2.jpeg
    - assets/images/farm_bg3.jpeg
    - assets/images/farm_bg4.jpeg
    - assets/models/pomegranat_quality_model.tflite
    - assets/models/labels.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon1.png"